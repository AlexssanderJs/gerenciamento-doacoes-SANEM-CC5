services:
  mysql:
    image: mysql:8.0
    container_name: javalovers-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sanem
      MYSQL_USER: sanem
      MYSQL_PASSWORD: sanem123
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/script-create-tables.sql:/docker-entrypoint-initdb.d/01-create-tables.sql
      - ./db/script-insert-values.sql:/docker-entrypoint-initdb.d/02-insert-values.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sanem", "--password=sanem123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - javalovers-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: javalovers-mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - javalovers-network

  backend:
    build: ./backend
    container_name: javalovers-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sanem
      DB_USER: sanem
      DB_PASSWORD: sanem123
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sanem?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: sanem
      SPRING_DATASOURCE_PASSWORD: sanem123
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - javalovers-network

  frontend:
    build: ./frontend
    container_name: javalovers-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - javalovers-network

volumes:
  mysql_data:

networks:
  javalovers-network:
    driver: bridge
    