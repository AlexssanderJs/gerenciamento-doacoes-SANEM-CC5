services:
  postgres:
    image: postgres:16-alpine
    container_name: sanem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sanem
      POSTGRES_USER: sanem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanem123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanem -d sanem"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - sanem-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: sanem-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - sanem-network

  backend:
    build: ./backend
    container_name: sanem-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # Dentro da rede Docker, localhost NÃO é o container do PostgreSQL.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sanem
      SPRING_DATASOURCE_USERNAME: sanem
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sanem123}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - sanem-network

  frontend:
    build: ./frontend
    container_name: sanem-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - sanem-network

volumes:
  postgres_data:

networks:
  sanem-network:
    driver: bridge
