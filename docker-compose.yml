services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: sanem-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - sanem-network

  backend:
    build: ./backend
    container_name: sanem-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    # O banco é PostgreSQL na nuvem (NeonDB). As credenciais vêm do .env:
    # SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
    depends_on:
      mailpit:
        condition: service_started
    networks:
      - sanem-network

  frontend:
    build: ./frontend
    container_name: sanem-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - sanem-network

networks:
  sanem-network:
    driver: bridge
