server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: javalovers-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:sanem}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        # Forçar atualização do metamodel
        hbm2ddl:
          auto: none
        # Limpar cache de segunda instância (se houver)
        cache:
          use_second_level_cache: false
          use_query_cache: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "1"

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:noreply@sanem.local}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
    dev-log-fallback: ${PASSWORD_RESET_DEV_LOG:true}

logging:
  level:
    com.javalovers: DEBUG
    org.springframework.security: DEBUG

